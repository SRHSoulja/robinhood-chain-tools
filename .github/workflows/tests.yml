# Runs the whole suite on every push and pull request, so a green tick on a commit means the tests that
# guard each audit finding actually passed on exactly those bytes.
name: tests
on:
  push:
    branches: [main]
  pull_request:
# Actions are pinned to commit hashes, not tags: a tag can be moved, and this repository's argument is
# that what runs is what was reviewed.
permissions:
  contents: read          # nothing else: this workflow only needs to read the code it tests
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false   # this job then runs code from the pull request
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09   # v1
        with:
          version: v1.4.1        # pinned: "stable" is a moving target
      # Cheap and first, so a stale CSP hash or a page pointing at the wrong contract fails in seconds rather
      # than after a sixteen-minute browser run. This also stops depending on anyone's local git config: the
      # same checks live in .githooks/pre-commit, and a fresh clone has no core.hooksPath set, so before this
      # they ran only for whoever had configured them.
      - name: preflight, the cheap consistency checks
        run: ./preflight.sh
      - name: the deployed bytecode is what this source builds
        run: |
          set -euo pipefail
          forge build
          addr="$(python3 -c "import json;print(json.load(open('deployments.testnet.json'))['BulkSend'])")"
          chain="$(curl -sS --max-time 30 -X POST https://rpc.testnet.chain.robinhood.com \
            -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getCode\",\"params\":[\"$addr\",\"latest\"]}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"])')"
          built="$(python3 -c "import json;print(json.load(open('out/BulkSend.sol/BulkSend.json'))['deployedBytecode']['object'])")"
          # Equality. Printing a length and calling it an equality check is how a step's name outlives what
          # it does.
          [ "$chain" = "$built" ] || { echo "the deployed runtime is not what this source builds"; exit 1; }
          echo "  ok    $(( (${#built} - 2) / 2 )) bytes, identical at $addr"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: '22.20.0'   # pinned: a major line moves under you
      - name: install, from the lockfile
        run: |
          npm ci --no-audit --no-fund      # the lockfile decides, not the registry
          npx playwright install --with-deps chromium
      # ./verify.sh, not `npm test` and not `forge test`. This is the whole point of the step.
      #
      # CI used to run `forge test --no-match-path 'test/Audit*.t.sol'` plus `npm test`, which between them
      # EXCLUDE every probe file. The probe files are the only thing in this repository that can tell a fix
      # from a belief: they reproduce a finding, so a probe that fails is a finding that is fixed, and roughly
      # twenty closed findings are pinned by nothing else. Nothing ran them automatically, so a later change
      # could quietly reopen any of them and still get a green tick.
      #
      # verify.sh runs the contract tests, both browser suites, the publish gate, and every probe file, and
      # compares the probe counts against test/findings-baseline.json. It fails if a closed finding reproduces
      # again, and it fails on a probe file the baseline has never heard of -- because twice now a probe file
      # has been added with nothing watching it.
      - name: everything, including the probes that pin every closed finding
        run: ./verify.sh
      - name: the connector is reproducible from its pinned source
        run: |
          set -euo pipefail
          cd web/wc-build
          npm ci --no-audit --no-fund
          npx esbuild entry.js --bundle --format=esm --minify --platform=browser --target=es2020 --outfile=/tmp/wc-rebuilt.js
          built="$(sha256sum /tmp/wc-rebuilt.js | cut -d' ' -f1)"
          shipped="$(sha256sum ../wc.js | cut -d' ' -f1)"
          expected="$(tr -d '[:space:]' < EXPECTED-SHA256)"
          echo "  rebuilt  $built"
          echo "  shipped  $shipped"
          echo "  expected $expected"
          [ "$built" = "$shipped" ] || { echo "the pinned source no longer produces the shipped bundle"; exit 1; }
          [ "$built" = "$expected" ] || { echo "the shipped bundle no longer matches its reviewed digest"; exit 1; }
