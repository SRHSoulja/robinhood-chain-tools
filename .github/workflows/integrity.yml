# Watches the live sites from somewhere that is not the thing being watched.
#
# The publish script already compares bytes, but only while publishing, which is exactly when nothing is
# wrong. This runs on GitHub's infrastructure, on GitHub's credentials, against the files in this repository,
# and needs no secrets at all: if the live pages stop matching what is committed here, the job fails and
# GitHub tells the maintainer. Someone who takes the Cloudflare account cannot quietly switch it off, and
# someone who takes this repository cannot change the pages.
#
# Two things about a monitor that only e-mails one person, both of which bite hardest during exactly the
# quiet stretch worth monitoring:
#   - a failure went to one inbox and nowhere else, so nobody but the maintainer could see the state. The
#     README now carries this workflow's badge, and a failure opens an issue, which is public and does not
#     depend on anyone reading their mail.
#   - GitHub disables scheduled workflows in a public repository after 60 days with no repository activity.
#     A monitor that switches itself off after two quiet months is worse than none, because the badge keeps
#     showing the last run it managed. Noted in docs/for-reviewers.md so it is somebody's known problem
#     rather than a surprise.
name: integrity
on:
  schedule:
    - cron: '17 */6 * * *'     # four times a day, offset so it is not competing with everyone else's hour
  workflow_dispatch:
# Actions are pinned to commit hashes, not tags: a tag can be moved, and this repository's argument is
# that what runs is what was reviewed.
permissions:
  contents: read
  issues: write        # only so a failure can open one; see the last step
jobs:
  live-matches-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - name: the served pages are the files in this repository
        run: |
          set -euo pipefail
          fail=0
          check () {
            local url="$1" file="$2"
            local live want
            live="$(curl -sSL --max-time 30 "$url" | sha256sum | cut -d' ' -f1)"
            want="$(sha256sum "$file" | cut -d' ' -f1)"
            if [ "$live" = "$want" ]; then
              echo "  ok    $url"
            else
              echo "  DIFFERS $url"
              echo "          served $live"
              echo "          source $want"
              fail=1
            fi
          }
          check https://rhairdrop.gmgnrepeat.com/ web/index.html
          check https://rhcheck.gmgnrepeat.com/ web/check.html
          check https://rhairdrop.gmgnrepeat.com/wc.js web/wc.js
          exit $fail

      - name: the connector is the reviewed one
        run: |
          set -euo pipefail
          want="$(tr -d '[:space:]' < web/wc-build/EXPECTED-SHA256)"
          got="$(sha256sum web/wc.js | cut -d' ' -f1)"
          [ "$want" = "$got" ] || { echo "web/wc.js does not match its reviewed digest"; exit 1; }
          echo "  ok    connector matches web/wc-build/EXPECTED-SHA256"

      - name: plain HTTP is still refused, and HSTS is still sent
        run: |
          set -euo pipefail
          for host in rhairdrop.gmgnrepeat.com rhcheck.gmgnrepeat.com; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "http://$host/")"
            [ "$code" = "301" ] || { echo "http://$host/ answered $code, expected 301"; exit 1; }
            curl -sI --max-time 25 "https://$host/" | grep -qi '^strict-transport-security:' \
              || { echo "https://$host/ sent no HSTS header"; exit 1; }
            echo "  ok    $host redirects and sends HSTS"
          done

          # The body hash checked further down cannot see a header change, because the CSP header is generated
          # by deploy/publish.sh from the meta tag at publish time and lives in the worker, not in web/*.html.
          # So a worker republished without `frame-ancestors 'none'` -- the one directive a meta tag cannot
          # express -- passed every check in this file. That is not hypothetical: rhcheck's worker went out
          # without the header from secure() at all, and the green runs here did not notice, because the only
          # responses this file checked for CSP were the /x/ ones.
          for host in rhairdrop.gmgnrepeat.com rhcheck.gmgnrepeat.com; do
            page="$([ "$host" = "rhairdrop.gmgnrepeat.com" ] && echo web/index.html || echo web/check.html)"
            csp="$(curl -sI --max-time 25 "https://$host/" | tr -d '\r' | grep -i '^content-security-policy:' | cut -d' ' -f2-)"
            [ -n "$csp" ] || { echo "https://$host/ sent no Content-Security-Policy header at all"; exit 1; }
            case "$csp" in
              *"frame-ancestors 'none'"*) ;;
              *) echo "https://$host/ has a CSP with no frame-ancestors 'none'; the page can be framed"; exit 1 ;;
            esac
            # The header must carry the hash of the script in THIS repository. A worker serving an older page
            # with an older policy is a drift this file exists to catch, and the body hash below only catches
            # it when the body is also stale.
            want="$(grep -o "sha256-[A-Za-z0-9+/=]*" "$page" | head -1)"
            [ -n "$want" ] || { echo "$page names no script hash"; exit 1; }
            case "$csp" in
              *"$want"*) ;;
              *) echo "https://$host/ CSP does not name $page's script hash ($want)"; exit 1 ;;
            esac
            # 'unsafe-inline' is legitimate in style-src and never in script-src, so this looks at the one
            # directive rather than the whole policy.
            script_src="$(printf '%s' "$csp" | tr ';' '\n' | grep -i 'script-src' || true)"
            case "$script_src" in
              *unsafe-inline*|*unsafe-eval*|*strict-dynamic*|*unsafe-hashes*)
                echo "https://$host/ script-src carries an unsafe token: $script_src"; exit 1 ;;
            esac
            echo "  ok    $host sends a CSP with frame-ancestors none, this repository's hash, and no unsafe script-src token"
          done

          # /cdn-cgi/* is Cloudflare's, answered before any Worker, so nothing in this repository can put a
          # header on it. SECURITY.md says so explicitly. This asserts the state that sentence describes, and
          # will fail if zone-level HSTS is ever turned on -- at which point the sentence needs updating too.
          for host in rhairdrop.gmgnrepeat.com rhcheck.gmgnrepeat.com; do
            if curl -sI --max-time 25 "https://$host/cdn-cgi/trace" | grep -qi '^strict-transport-security:'; then
              echo "$host/cdn-cgi/ now sends HSTS. Good, but SECURITY.md's Transport section still says it does not."
              exit 1
            fi
            echo "  note  $host/cdn-cgi/ sends no HSTS, as SECURITY.md states"
          done

      - name: the explorer passthrough never serves someone else's document from this origin
        run: |
          set -euo pipefail
          for host in rhcheck.gmgnrepeat.com rhairdrop.gmgnrepeat.com; do
            for path in "/x/46630/tokens/0x0000000000000000000000000000000000000000" "/x/4663/stats"; do
              hdr="$(curl -sI --max-time 25 "https://$host$path")"
              # The status is the second field of the status line. Stripping non-digits from the whole line turned
              # "HTTP/2 200" into "2200", and this step failed on every run since it was added while the site was fine.
              code="$(printf '%s' "$hdr" | head -1 | awk '{print $2}')"
              [ "$code" = "200" ] || { echo "$path answered $code; a non-2xx from here is replaced by Cloudflare with our own page"; exit 1; }
              printf '%s' "$hdr" | grep -qi '^content-type: application/json' \
                || { echo "$path did not answer JSON; it must never pass a third-party document through"; exit 1; }
              printf '%s' "$hdr" | grep -qi '^content-security-policy:' \
                || { echo "$path sent no CSP header; frame-ancestors cannot come from a meta tag"; exit 1; }
              printf '%s' "$hdr" | grep -qi '^strict-transport-security:' \
                || { echo "$path sent no HSTS"; exit 1; }
              echo "  ok    $path is JSON, 200, with the full header set"
            done
          done

      - name: the error paths are hardened too, not just the healthy ones
        run: |
          set -euo pipefail
          # A visitor whose first contact with the host is a mistyped path or a bad request is exactly the
          # visitor who has not been pinned to HTTPS yet. "Every response" has to include the ones that
          # went wrong, so each of these is checked rather than assumed.
          hardened () {
            local url="$1" want_code="$2" h
            h="$(curl -s -o /dev/null -D - --max-time 25 "$url")"
            local code; code="$(printf '%s' "$h" | head -1 | awk '{print $2}')"
            [ "$code" = "$want_code" ] || { echo "  $url answered $code, expected $want_code"; return 1; }
            for header in strict-transport-security x-content-type-options referrer-policy cross-origin-opener-policy; do
              printf '%s' "$h" | grep -qi "^$header:" || { echo "  $url ($code) sent no $header"; return 1; }
            done
            echo "  ok    $url -> $code, hardened"
          }
          fail=0
          hardened https://rhcheck.gmgnrepeat.com/x/46630/a..b 400 || fail=1
          hardened https://rhcheck.gmgnrepeat.com/nothing-here 302 || fail=1
          hardened https://rhairdrop.gmgnrepeat.com/nothing-here 302 || fail=1
          hardened https://rhairdrop.gmgnrepeat.com/wc.js 200 || fail=1
          exit $fail

      - name: the page still points at the reviewed contract, and mainnet is still off
        run: |
          set -euo pipefail
          # Written to a file rather than piped: `grep -q` exits as soon as it matches, which closes the pipe
          # and, under pipefail, fails the step for a page that is perfectly correct.
          curl -sSL --max-time 30 https://rhairdrop.gmgnrepeat.com/ > /tmp/live.html
          want="$(python3 -c "import json;print(json.load(open('deployments.testnet.json'))['BulkSend'])")"
          grep -qF "$want" /tmp/live.html || { echo "the live page does not name $want"; exit 1; }
          grep -qF "LIVE_CHAINS = new Set([46630])" /tmp/live.html || { echo "mainnet may no longer be disabled"; exit 1; }
          echo "  ok    contract $want, mainnet disabled"

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09   # v1
        # Pinned to the same toolchain the test workflow uses. Left to its default this action installs
        # whatever `stable` is on the day it runs, so a monitor that is supposed to prove the deployed
        # runtime still matches this source would be comparing against a compiler nobody reviewed.
        with:
          version: v1.4.1
      - name: the deployed contract is byte-for-byte what this source builds
        run: |
          set -euo pipefail
          forge build
          addr="$(python3 -c "import json;print(json.load(open('deployments.testnet.json'))['BulkSend'])")"
          chain="$(curl -sS --max-time 30 -X POST https://rpc.testnet.chain.robinhood.com \
            -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getCode\",\"params\":[\"$addr\",\"latest\"]}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"])')"
          local_code="$(python3 -c "import json;print(json.load(open('out/BulkSend.sol/BulkSend.json'))['deployedBytecode']['object'])")"
          echo "  on chain : $(( (${#chain} - 2) / 2 )) bytes at $addr"
          echo "  built    : $(( (${#local_code} - 2) / 2 )) bytes from this source"
          # Equality, not "there is something there". The whole point of the address being in this file is
          # that it can be checked against what this source produces.
          [ "$chain" = "$local_code" ] || { echo "the deployed runtime is NOT what this source builds"; exit 1; }
          echo "  ok    identical"

      # A monitor whose only channel is one person's e-mail is a monitor that fails quietly. This opens an
      # issue on the repository, which is public, searchable, and does not depend on anyone reading their
      # mail on a weekend.
      # Gate 9. The page lists more than one RPC per chain and falls back down the list; this checks the list is
      # still a list: the endpoint listed first must answer, and so must at least one fallback per chain, each
      # with the right chain id and eth_simulateV1, which the page's test run depends on. Every answer is printed.
      - name: the RPC endpoints the page lists still answer, first and fallback
        run: |
          set -euo pipefail
          probe() {
            local url="$1" want="$2" id sim
            id="$(curl -sS --max-time 15 -X POST "$url" -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' | tr -d ' \n' | sed -n 's/.*"result":"0x\([0-9a-fA-F]*\)".*/\1/p' || true)"
            id="$(printf '%d' "0x${id:-0}" 2>/dev/null || echo 0)"
            sim="$(curl -sS --max-time 20 -X POST "$url" -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":2,"method":"eth_simulateV1","params":[{"blockStateCalls":[{"calls":[{"to":"0x0000000000000000000000000000000000000001","data":"0x"}]}],"validation":false},"latest"]}' | grep -q '"result"' && echo ok || echo no)"
            echo "  chain $id simulate $sim  $url"
            [ "$id" = "$want" ] && [ "$sim" = "ok" ]
          }
          fail=0
          for chain in 46630 4663; do
            # the rpcs list for this chain, as written in the page
            list="$(tr -d '\n' < web/index.html | grep -oE "$chain: *\{[^}]*rpcs: *\[[^]]*\]" | grep -oE "rpcs: *\[[^]]*\]" | grep -oE "https://[^' ]+" )"
            first="$(echo "$list" | head -1)"; rest="$(echo "$list" | tail -n +2)"
            [ -n "$first" ] || { echo "no rpcs list found for $chain in web/index.html"; fail=1; continue; }
            probe "$first" "$chain" || { echo "the endpoint listed first for $chain does not answer"; fail=1; }
            ok=0; for u in $rest; do probe "$u" "$chain" && ok=1; done
            [ "$ok" = 1 ] || { echo "no fallback answers for $chain"; fail=1; }
          done
          [ "$fail" = 0 ]
      # Gate 11. The mainnet explorer challenges every non-browser client; the Worker answers /x/4663/ paths by
      # translating them to Blockscout's PRO API behind a bound key. The page treats the {"error":"upstream"}
      # envelope as "could not check", so a dark explorer is invisible to every other test. This one asks the
      # live Worker for a real mainnet collection's holders and refuses the envelope.
      - name: the mainnet explorer answers through the Worker, not the upstream-error envelope
        run: |
          set -euo pipefail
          # Round eighteen: assert real answers, not the presence of a word. A holders page must carry a non-empty
          # items array; a contract known to be unverified must read false; one known to be verified must read
          # true with its name. An envelope, a void, or an inversion fails here.
          # Round nineteen F-6: both Workers serve /x/4663 now (the airdrop page routes through its own), so both
          # are asked; the gate-11 closure condition was only ever checked on Check.
          for host in rhcheck.gmgnrepeat.com rhairdrop.gmgnrepeat.com; do
          echo "  host: $host"
          j() { curl -sS --max-time 25 "https://$host/x/4663$1"; }
          h="$(j /tokens/0xdFa5D366Cc9B2bdf08d44A7d7e891012C893385b/holders)"; echo "  holders: ${h:0:120}"
          printf '%s' "$h" | python3 -c 'import sys,json; d=json.load(sys.stdin); it=d.get("items"); assert isinstance(it,list) and len(it)>0 and it[0]["address"]["hash"].startswith("0x"), d' \
            || { echo "the holders page is not a non-empty items list; the mainnet explorer path is dark or wrong"; exit 1; }
          u="$(j /smart-contracts/0x324f1fddc6df85859e52f43f365d6b06670b74a1)"; echo "  unverified: ${u:0:120}"
          printf '%s' "$u" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("is_verified") is False, d' \
            || { echo "a contract known to be unverified does not read is_verified false"; exit 1; }
          v="$(j /smart-contracts/0x8876789976decbfcbbbe364623c63652db8c0904)"; echo "  verified: ${v:0:120}"
          printf '%s' "$v" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("is_verified") is True and d.get("name")=="UniversalRouter" and len(d.get("abi") or [])>0, {k:d.get(k) for k in ("is_verified","name")}' \
            || { echo "a contract known to be verified does not read as verified with its name and ABI"; exit 1; }
          done
      - name: say so somewhere public if this failed
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea   # v7
        with:
          script: |
            const title = 'integrity check failed: the live pages may not match this repository';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'integrity',
            });
            const body = [
              'The scheduled integrity check failed.',
              '',
              'That means one of: a live page no longer matches the file in this repository, a security header',
              'is missing, the explorer passthrough served something it should not, or the site is unreachable.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This issue was opened by the workflow itself. Close it once the run is green again.',
            ].join('\n');
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['integrity'],
              });
            }
