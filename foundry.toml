[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned so the mainnet bytecode is reproducible and matches the verified source (audit finding 4).
solc_version = "0.8.36"
# Robinhood Chain testnet and mainnet both run nitro v3.11 at ArbOS 61 (checked 2026-09-06), which supports Cancun.
evm_version = "cancun"
optimizer = true
# 10,000 runs: measured -90 gas/recipient on 721 strict, -98 lenient, -99 on ERC-20, for 1,088 extra runtime
# bytes (about 218k gas once at deploy). Break-even at 2,422 recipients. 1,000,000 runs buys 0-7 more.
optimizer_runs = 10000
# Legacy codegen. via-IR is -236 gas/recipient on the 721 lenient path but +84 on 721 strict unsafe, the
# mode this contract is used in most, and it would change the pipeline that produced every byte rehearsed
# on the live chain. Not worth 0.4% either way.
via_ir = false

[fuzz]
runs = 512

[invariant]
# Random sequences over all three paths (test/Invariants.t.sol). A handler call that reverts is a finding.
runs = 96
depth = 24
fail_on_revert = true
